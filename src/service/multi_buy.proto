syntax = "proto3";

package helium.multi_buy;

import "region.proto";

message multi_buy_inc_req_v1 {
  string key = 1;
  bytes hotspot_key = 2;
  region region = 3;
}

message multi_buy_inc_res_v1 {
  uint32 count = 1;
  bool denied = 2;
}

service multi_buy {
  rpc inc(multi_buy_inc_req_v1) returns (multi_buy_inc_res_v1);
}
